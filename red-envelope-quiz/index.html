</style></head><body><main><header><b>HANNA</b><a href="https://www.instagram.com/_hannapang/" target="_blank" rel="noopener">Instagram ↗</a></header><section class="hero"><span class="tag">家庭金錢小測驗</span><h1>替孩子存錢時<br>妳最在意的是什麼？</h1><p>同樣是替孩子存錢，每個媽媽心裡想的可能都不一樣<br>選一個最接近妳現在心情的答案</p></section><section class="grid" aria-label="選擇最接近妳的答案">
<button class="option" data-key="A" aria-pressed="false"><span class="letter">A · 隨時有準備</span><span class="icon" aria-hidden="true">👛</span><strong>需要時<br>隨時拿得出來</strong><small>遇到事情，手上有錢能用</small></button>
<button class="option" data-key="B" aria-pressed="false"><span class="letter">B · 提前有安排</span><span class="icon" aria-hidden="true">🎒</span><strong>以後的學費<br>能提前準備</strong><small>知道未來的支出有著落</small></button>
<button class="option" data-key="C" aria-pressed="false"><span class="letter">C · 未來有選擇</span><span class="icon" aria-hidden="true">🌱</span><strong>慢慢累積<br>讓他多一些選擇</strong><small>想做的事，能有機會試試</small></button>
<button class="option" data-key="D" aria-pressed="false"><span class="letter">D · 孩子有能力</span><span class="icon" aria-hidden="true">📒</span><strong>陪他學會<br>怎麼管理這筆錢</strong><small>長大後，也能自己做決定</small></button></section><p class="note">憑直覺選就好，答案沒有好壞<br>這是自我探索小練習，不是心理診斷或投資適合度評估</p><article id="result" hidden aria-live="polite" tabindex="-1"></article><section class="story"><span class="tag">關於 HANNA</span><h2>替孩子準備未來<br>也從照顧好現在開始</h2><p>我是 Hanna，也是一位媽媽<br>我在意家庭、陪伴，也喜歡把複雜的金錢觀念講得簡單一點</p><p>如果妳想知道，我為什麼開始學習加密貨幣，以及成為媽媽後的改變，可以看看我的故事</p></section><footer>© Hanna · @_hannapang</footer></main><div class="dock"><a href="https://carousel2026.github.io/hanna/hanna-story/">看看 Hanna 的故事 <span>↗</span></a></div><script>
const answers={
A:{name:'妳在意的，是需要時能接得住',lead:'比起帳戶裡的數字長得多快，妳更在意家裡臨時有事時，這筆錢能不能真的派上用場',habit:'妳可能會先確認能不能領回、多久能拿到，才考慮收益，帳戶裡留有餘裕，會讓妳比較安心',strength:'妳會替家庭保留轉圜空間，突發支出出現時，也比較不容易被迫借錢或急著賣掉資產',trouble:'如果每一筆錢都想隨時能用，可能一直沒空分清楚，哪些是應急用，哪些其實可以留得更久',action:'先列出每月必要支出，再依收入穩定程度與家庭責任訂出備用金目標，把近期會用的錢與長期預算分開，不用要求每一筆錢都同時兼顧所有用途',child:'下次孩子收到紅包，可以一起分出「近期想用」和「先留著」兩份，讓他知道，留一筆錢是為了遇到事情時有辦法',reminder:'讓妳安心的安排，才比較容易持續，先把需要用的錢留好，不必急著追高收益'},
B:{name:'妳在意的，是未來的日子有著落',lead:'妳想到的可能是學費、才藝費，或孩子換一個學習階段時，那些早晚會來的支出',habit:'妳可能喜歡有目標、有期限的規劃，知道每個月要準備多少，比單看報酬率更讓妳踏實',strength:'妳願意提早看見需求，把一筆大支出拆成每月能負擔的小額準備，減少到時候的壓力',trouble:'費用會變，家庭收入也可能變，如果計畫訂得太滿，每個月反而容易覺得自己做得不夠',action:'先寫下用途、預計使用時間與目標金額，再扣掉已經存好的部分，估算每月需要準備多少，每年檢查一次，越接近用錢時間，越要確認資金能按時取用，避免到時被迫承受價格波動',child:'可以和孩子做一張小小的目標表，從他想買的書開始，陪他看看還差多少、要準備多久',reminder:'計畫可以調整，金額也可以重算，讓準備跟得上生活，比勉強照表走更重要'},
C:{name:'妳在意的，是他長大後有得選',lead:'妳想存下的，可能是一個學習的機會、一趟想去的旅程，或孩子想試一試時，家裡能支持他的一份底氣',habit:'妳可能願意用更長的時間累積，也會想了解不同工具，希望每月的準備能替未來多留一些空間',strength:'妳有長期眼光，知道小額持續投入也能累積本金，不需要等到有一大筆錢才開始',trouble:'期待未來的時候，容易被漂亮的試算吸引，忽略中間可能遇到的虧損、費用與生活變動',action:'先決定每月不影響生活的預算，再分清楚存入的本金和投資收益，評估工具時，同時看最壞情境、費用、贖回條件與資金集中程度，不把一種報酬假設當成未來一定會發生的結果',child:'和孩子聊聊他想學什麼、想去哪裡，讓存錢連結到具體願望，也一起討論願望改變時，這筆錢可以怎麼重新安排',reminder:'未來多一點選擇，也包含今天保有調整的餘裕，長期準備可以慢慢來'},
D:{name:'妳在意的，是他學會自己管理',lead:'妳希望交到孩子手裡的，除了存下來的錢，還有分辨需要、安排預算與承擔選擇的能力',habit:'妳可能常想著要怎麼解釋、怎麼帶他練習，比起直接幫他決定，更希望他懂得為什麼',strength:'妳把日常當成練習機會，孩子有機會在小金額裡學習等待、取捨，也慢慢建立自己的判斷',trouble:'太希望他學會，有時可能不自覺替他選好答案，或在他花錯錢時，急著把每一次都變成一堂課',action:'從一筆適齡、可承受的小預算開始，和孩子約定用途及規則，讓他記錄花在哪裡，再一起回顧哪次花得值得，大人的教育金與家庭備用金，仍由大人依需求安排',child:'孩子想買東西時，可以問「買了這個，還剩多少？」或「你想現在買，還是留給另一個願望？」讓他有真正做決定的機會',reminder:'練習花錢也會有後悔，讓小失誤留在小金額裡，陪他回顧就好'}
};const result=document.querySelector('#result');function show(k,scroll=true){if(!answers[k])return;const a=answers[k];document.querySelectorAll('.option').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.key===k)));result.innerHTML=`<span class="tag">妳選了 ${k}</span><h2>${a.name}</h2><p class="lead">${a.lead}</p><h3>妳可能有的金錢習慣</h3><p>${a.habit}</p><h3>這份在意，帶來的優勢</h3><p>${a.strength}</p><h3>也許會遇到的小困擾</h3><p>${a.trouble}</p><h3>可以先做的一個調整</h3><p>${a.action}</p><h3>和孩子一起練習</h3><p>${a.child}</p><div class="reminder">${a.reminder}</div><button class="reset" type="button">↑ 回去看看其他選項</button>`;result.hidden=false;history.replaceState(null,'','#answer-'+k);result.querySelector('.reset').onclick=()=>document.querySelector('.grid').scrollIntoView({behavior:'smooth'});if(scroll){result.scrollIntoView({behavior:'smooth'});result.focus({preventScroll:true})}}document.querySelectorAll('.option').forEach(b=>b.onclick=()=>show(b.dataset.key));const key=location.hash.replace('#answer-','');if(answers[key])show(key,false);
</script></body></html>
